<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Signup Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins", sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    .signup-container{
      width:400px;
      padding:40px;
      border-radius:25px;
      background:rgba(255,255,255,0.2);
      backdrop-filter:blur(12px);
      box-shadow:0 8px 32px rgba(0,0,0,0.2);
      border:1px solid rgba(255,255,255,0.3);
    }

    .signup-container h1{
      text-align:center;
      color:#5a4b81;
      margin-bottom:10px;
      font-size:32px;
    }

    .signup-container p{
      text-align:center;
      margin-bottom:25px;
      color:#555;
      font-size:14px;
    }

    .input-group{
      margin-bottom:18px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      color:#444;
      font-size:14px;
    }

    .input-group input,
    .input-group textarea{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      outline:none;
      background:rgba(255,255,255,0.7);
      font-size:14px;
      resize:none;
      transition:0.3s;
    }

    .input-group input:focus,
    .input-group textarea:focus{
      background:white;
      box-shadow:0 0 10px rgba(140,120,255,0.3);
    }

    .signup-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg, #9b7bff, #ff8ccf);
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .signup-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 16px rgba(155,123,255,0.4);
    }

    .footer-text{
      margin-top:18px;
      text-align:center;
      font-size:13px;
      color:#444;
    }

    .footer-text a{
      color:#8b5cf6;
      text-decoration:none;
      font-weight:600;
    }

    .footer-text a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body background="">

  <div class="signup-container">

    <h1>Create Account</h1>
    <p>Join us and begin your aesthetic experience ✨</p>

    <form id="signup-form">

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="input-group">
        <label>Phone</label>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>
      </div>

      <button type="submit" class="signup-btn">
        Sign Up
      </button>

    </form>

    <div id="message" class="footer-text"></div>

    <div class="footer-text">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <script>
    const signupForm = document.getElementById('signup-form');
    const messageEl = document.getElementById('message');

    signupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      messageEl.textContent = '';

      const payload = {
        name: signupForm.name.value.trim(),
        phone: signupForm.phone.value.trim(),
        email: signupForm.email.value.trim(),
        password: signupForm.password.value
      };

      try {
        const response = await fetch('http://localhost:3000/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Signup failed');

        messageEl.style.color = '#0b6623';
        messageEl.textContent = 'Signup successful! Redirecting to login...';
        signupForm.reset();

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1400);
      } catch (error) {
        messageEl.style.color = '#a10000';
        messageEl.textContent = error.message;
      }
    });
  </script>

</body>
</html>
